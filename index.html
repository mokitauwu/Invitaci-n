

<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Operación: Cine 🖤</title>

<style>

body {

  margin: 0;

  min-height: 100vh;

  display: grid;

  place-items: center;

  background: radial-gradient(circle, #300609, #050505 70%);

  color: white;

  font-family: Arial, sans-serif;

  padding: 18px;

  box-sizing: border-box;

}

.card {

  width: 100%;

  max-width: 420px;

  box-sizing: border-box;

  text-align: center;

  padding: 30px 22px;

  border: 1px solid #a3131d;

  border-top: 4px solid #e50914;

  background: #090909;

  box-shadow: 0 0 30px #e5091430;

}

.small {

  color: #ff343d;

  font-size: 11px;

  letter-spacing: 3px;

  font-weight: bold;

}

.symbol {

  color: #e50914;

  font-size: 65px;

  margin: 24px 0 10px;

}

h1 {

  font-size: 32px;

  margin: 8px 0;

}

h1 span { color: #e50914; }

.subtitle {

  color: #ff343d;

  letter-spacing: 2px;

  font-size: 12px;

  font-weight: bold;

}

.line {

  height: 1px;

  background: #8b1b22;

  margin: 25px 0;

}

.message {

  font-size: 20px;

  line-height: 1.5;

}

.date {

  color: #ff343d;

  font-weight: bold;

  margin: 18px 0;

}

.note {

  color: #aaa;

  font-size: 13px;

  line-height: 1.6;

}

button {

  width: 100%;

  padding: 15px;

  background: #e50914;

  color: white;

  border: 0;

  font-size: 16px;

  font-weight: bold;

  margin-top: 18px;

  cursor: pointer;

}

#reply {

  display: none;

  color: #ff424a;

  line-height: 1.5;

  margin-top: 20px;

  font-weight: bold;

}

.footer {

  margin-top: 28px;

  color: #666;

  font-size: 10px;

  letter-spacing: 2px;

}

</style>

</head>

<body>

<main class="card">

  <div class="small">MENSAJE CONFIDENCIAL</div>

  <div class="symbol">☣</div>

  <h1>¿MISIÓN <span>DE CINE?</span></h1>

  <p class="subtitle">OPERACIÓN: RESIDENT EVIL</p>

  <div class="line"></div>

  <p class="message">¿Te gustaría ir al cine conmigo este viernes 16 de octubre?</p>

  <p class="date">VIERNES · 16 OCTUBRE</p>

  <p class="note">Se recomienda valentía, palomitas y no soltarme la mano en las partes de miedo. 🖤</p>

  <button onclick="document.getElementById('reply').style.display='block';document.getElementById('reply').textContent='¡Misión aceptada! Nos vemos el viernes. 🖤'">

    SÍ, VAMOS ❤️

  </button>

  <div id="reply"></div>

  <div class="footer">ARCHIVO 16-10-26 · SOLO PARA TUS OJOS</div>

</main>

</body>

</html>
