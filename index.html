
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Vamos al cine? ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at top, #541414, #100909 70%);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .tarjeta {
      width: 100%;
      max-width: 390px;
      padding: 30px 22px;
      border: 1px solid #a83232;
      border-radius: 22px;
      background: rgba(20, 10, 10, 0.94);
      box-shadow: 0 0 35px #650d0d66;
    }
    .emoji { font-size: 52px; }
    h1 { color: #ff5555; font-size: 30px; }
    p { line-height: 1.6; color: #f3dede; }
    button {
      padding: 13px 24px;
      margin: 8px;
      border: 0;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    #si { background: #e63946; color: white; }
    #no { background: #333; color: white; }
    #respuesta { color: #ff8585; font-weight: bold; }
  </style>
</head>
<body>
  <main class="tarjeta">
    <div class="emoji">🎬❤️</div>
    <h1>Una invitación para ti</h1>
    <p>Tengo una pregunta importante para ti...</p>
    <h2>¿Vamos al cine juntos?</h2>
    <p>Una película, palomitas y un ratito contigo. ❤️</p>
    <button id="si" onclick="aceptar()">¡Sí, vamos! ❤️</button>
    <button id="no" onclick="rechazar()">No 🙈</button>
    <p id="respuesta"></p>
  </main>
  <script>
    function aceptar() {
      document.getElementById("respuesta").textContent =
        "¡Sabía que dirías que sí! 🥰🍿";
    }
    function rechazar() {
      document.getElementById("respuesta").textContent =
        "Piénsalo otra vez, quiero ir contigo. 🥺❤️";
    }
  </script>
</body>
</html>
